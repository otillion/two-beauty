<title>Two Beauty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Cormorant:ital,wght@1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
/* Layout concept: white page, black accents, huge uppercase hero that slides in letter by letter over two drifting outlined circles (the duo);
   black marquee, numbered service cards that fill black on hover, a nail-colour try-on, studio statement with counters,
   team, an Instagram strip, location and a five-step booking card (service, artist, date and time, details, confirm). */
:root{
  --bg:#FFFFFF; --bg2:#FFFFFF; --card:#FFFFFF; --ink:#0A0A0A; --muted:#6B6B6B; --line:rgba(10,10,10,.14);
  --band:#0A0A0A; --band-ink:#FFFFFF; --star:#B8935A; --gold1:#E9D29B; --gold2:#B8935A; --gold3:#8A6A36;
  --ok:#1D7048; --warn:#8F5E10; --bad:#B3261E;
  --f-display:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-serif:'Cormorant',Georgia,'Times New Roman',serif;
  --f-body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --bg2:#0A0A0A; --card:#111111; --ink:#FFFFFF; --muted:#A5A5A5; --line:rgba(255,255,255,.18);
  --band:#161616; --band-ink:#FFFFFF; --star:#D9B873; --gold1:#F1DEAE; --gold2:#D9B873; --gold3:#A98445;
  --ok:#5DC79B; --warn:#E3B25C; --bad:#F08A98;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
section{scroll-margin-top:70px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:110px}
.disp{font-family:var(--f-display);font-weight:600;text-transform:uppercase;line-height:.95;letter-spacing:.005em}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:600}
.eyebrow::before{content:"✦";color:var(--star);font-size:14px;letter-spacing:0}
.sec-head{display:grid;gap:18px;margin-bottom:56px;max-width:760px}
.sec-head h2{font-size:clamp(40px,7vw,92px)}
.sec-head p{color:var(--muted);max-width:56ch}
.it{font-family:var(--f-serif);font-style:italic;font-weight:500;text-transform:none;letter-spacing:0;color:var(--star)}
.it,.it .ch{background:linear-gradient(100deg,var(--gold3),var(--gold2) 35%,var(--gold1) 55%,var(--gold2) 75%,var(--gold3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.dbl{position:relative}
.dbl::after{content:"";position:absolute;inset:6px;border:1px solid var(--star);border-radius:inherit;opacity:.55;pointer-events:none}
.arch{position:relative;border-radius:999px 999px 18px 18px;overflow:hidden;box-shadow:0 0 0 1.5px var(--star),0 0 0 6px var(--bg),0 0 0 7px color-mix(in srgb,var(--star) 55%,transparent)}
.art{width:100%;height:100%;display:block}
.ph{display:block;position:relative;width:100%;height:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.7em;padding:1em 1.8em;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;text-decoration:none;border-radius:999px;overflow:hidden;transition:background .3s,color .3s,transform .3s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--bg)}
.btn.inv{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.btn.inv:hover{background:transparent;color:var(--band-ink)}
.btn.sm{padding:.7em 1.2em;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:14px;min-height:66px}
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:0 50%}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:50%;border:1px solid var(--line)}
.brand span{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.14em}
.links{display:flex;gap:26px;margin-left:auto}
.links a{position:relative;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;text-decoration:none;padding-block:6px}
.links a::after{content:"";position:absolute;left:0;bottom:0;height:1.5px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.ctrl{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 10px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:50%}
.icon-btn:hover{border-color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;padding-block:54px 70px}
.hero .circ{position:absolute;z-index:-1;border:1.5px solid var(--star);border-radius:50%;opacity:.9}
.hero .c1{width:min(56vw,640px);aspect-ratio:1;right:-6%;top:6%;animation:drift1 14s ease-in-out infinite alternate}
.hero .c2{width:min(56vw,640px);aspect-ratio:1;right:10%;top:20%;animation:drift2 16s ease-in-out infinite alternate;border-style:dashed;opacity:.5}
.hero .c3{width:84px;aspect-ratio:1;right:3%;top:3%;background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold3));border:0;opacity:1;animation:bob 6s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) rotate(0)}to{transform:translate(-4%,5%) rotate(40deg)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(6%,-6%)}}
@keyframes bob{from{transform:translateY(-14px) scale(.94)}to{transform:translateY(22px) scale(1.06)}}
.hi{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;margin-bottom:26px}
.hi i{font-style:normal;color:var(--star);font-size:18px;animation:spin 8s linear infinite;display:inline-block}
.mega{font-size:clamp(44px,8.4vw,132px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:40px;align-items:center}
.hero-art{position:relative;height:min(62vw,560px);margin-bottom:10px}
.hero-art .arch{position:absolute}
.hero-art .a1{left:26%;top:0;width:48%;height:100%}
.hero-art .a2{left:0;bottom:6%;width:34%;height:48%;z-index:2}
.hero-art .a3{right:0;top:8%;width:34%;height:46%}
.mega .ln{display:block;overflow:hidden;padding-bottom:.04em}
.mega .ch{display:inline-block;animation:chUp 1s cubic-bezier(.2,.85,.2,1) both;animation-delay:calc(var(--i)*38ms + var(--d,0ms))}
.mega .sp{display:inline-block;width:.26em}
.mega .wd{display:inline-block;white-space:nowrap}
.mega .it{font-size:.78em;line-height:1}
@keyframes chUp{from{transform:translateY(105%);opacity:.2}to{transform:none;opacity:1}}
.sub{display:flex;flex-wrap:wrap;gap:6px 22px;margin:28px 0 36px;font-family:var(--f-display);text-transform:uppercase;font-size:clamp(22px,3vw,34px);font-weight:500;letter-spacing:.04em}
.sub span{animation:fade 1s both}
.sub span:nth-child(2){animation-delay:.12s}.sub span:nth-child(3){animation-delay:.24s}.sub span:nth-child(4){animation-delay:.36s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero-foot{display:flex;flex-wrap:wrap;gap:22px 34px;align-items:center}
.chip-i{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 12px;font-size:14px;font-weight:600;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.chip-i b{color:var(--star)}
.badge{position:absolute;right:-18px;bottom:-34px;width:150px;height:150px;z-index:3;display:grid;place-items:center;text-decoration:none}
.badge svg.rot{position:absolute;inset:0;width:100%;height:100%;animation:spin 18s linear infinite}
.badge text{font-family:var(--f-body);font-weight:700;font-size:15px;letter-spacing:.14em;fill:var(--ink)}
.badge .core{width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform .4s}
.badge:hover .core{transform:scale(1.14) rotate(-45deg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* marquee */
.band{background:var(--band);color:var(--band-ink);overflow:hidden;padding-block:26px;display:grid;gap:10px}
.mq{display:flex;width:max-content;animation:scroll 50s linear infinite}
.mq.rev{animation-direction:reverse;animation-duration:64s}
.band:hover .mq{animation-play-state:paused}
.mq span{display:flex;align-items:center;gap:34px;padding-right:34px;white-space:nowrap;font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:clamp(34px,5vw,64px);line-height:1.15}
.mq span b{font-weight:600;-webkit-text-stroke:1.4px var(--band-ink);color:transparent}
.mq.rev span{font-family:var(--f-serif);font-style:italic;text-transform:none;font-weight:500;font-size:clamp(26px,3.6vw,46px)}
.mq i{font-style:normal;color:var(--star);font-size:.55em}
@keyframes scroll{to{transform:translateX(-50%)}}

/* services */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{position:relative;box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6px color-mix(in srgb,var(--star) 50%,transparent);display:flex;flex-direction:column;justify-content:space-between;gap:34px;min-height:330px;padding:26px;border:1.5px solid var(--ink);border-radius:22px;background:var(--card);text-align:left;overflow:hidden;isolation:isolate;transition:color .45s,transform .45s}
.card::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .55s cubic-bezier(.7,0,.2,1);z-index:-1;border-radius:inherit}
.card:hover,.card:focus-visible{color:var(--bg);transform:translateY(-6px)}
.card:hover::before,.card:focus-visible::before{transform:none}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.card .no{font-family:var(--f-display);font-size:18px;font-weight:500;letter-spacing:.1em}
.card .ci{width:72px;height:96px;flex:none}
.card h3{font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:30px;line-height:1.02;margin-bottom:10px}
.card p{font-size:14px;line-height:1.55;opacity:.78}
.card .arr{position:absolute;right:22px;bottom:22px;width:40px;height:40px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;transition:transform .4s}
.card:hover .arr{transform:rotate(-45deg)}
.card .txt{padding-right:46px}
.card.cta{background:var(--ink);color:var(--bg);justify-content:flex-end}
.card.cta::before{background:var(--bg2);}
.card.cta:hover{color:var(--ink)}
.card.cta h3{font-size:44px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card:hover .ic path,.card:hover .ic circle{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.6,0,.3,1) both}
.draw path,.draw circle{stroke-dasharray:1;animation:draw 1.2s cubic-bezier(.6,0,.3,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* colour try-on */
.tryon{background:var(--bg2);border-top:1px solid var(--line)}
.try{display:block;max-width:760px;margin-inline:auto;text-align:center}.try .eyebrow{justify-content:center}.try p{margin-inline:auto}.try #shades,.try .shades{justify-content:center}
.hand{width:100%;max-width:410px;margin-inline:auto;overflow:visible}
.hand .nail{transform-box:fill-box;transform-origin:50% 100%}
.hand.pop .nail{animation:pop .55s calc(var(--i)*70ms) both}
@keyframes pop{0%{transform:scale(.7,.5);opacity:.4}60%{transform:scale(1.08,1.08);opacity:1}100%{transform:none;opacity:1}}
.hand .gl{animation:glint 3.8s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.6}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.shades{display:flex;flex-wrap:wrap;gap:14px;margin:30px 0 22px}
.sw{width:52px;height:52px;border-radius:50%;border:2px solid transparent;padding:3px;background:none;transition:transform .25s,border-color .25s}
.sw i{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw:hover{transform:translateY(-4px)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.shade-name{margin-bottom:26px}
.shade-name small{display:block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;margin-bottom:8px;color:var(--muted)}
.shade-name span{font-family:var(--f-display);font-weight:600;font-size:clamp(40px,6vw,72px);text-transform:uppercase;line-height:1}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:72px;align-items:start}
.statement{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:clamp(34px,4.6vw,64px);line-height:1.08}
.statement b{font-family:var(--f-display);font-style:normal;font-weight:600;text-transform:uppercase;letter-spacing:.01em}
.blocks{border-top:1.5px solid var(--ink)}
.blk{display:grid;grid-template-columns:56px minmax(0,1fr);gap:18px;padding:24px 0;border-bottom:1px solid var(--line)}
.blk .n{font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--star)}
.blk h3{font-family:var(--f-display);font-weight:600;font-size:26px;text-transform:uppercase;margin-bottom:4px}
.blk p{color:var(--muted);font-size:15px}
.stats{background:var(--band);color:var(--band-ink)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding-block:56px}
.stats b{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(46px,7vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.7}

/* team */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.m{position:relative;box-shadow:inset 0 0 0 6px var(--bg),inset 0 0 0 7px color-mix(in srgb,var(--star) 55%,transparent);display:grid;gap:20px;align-content:space-between;min-height:440px;padding:36px;border:1.5px solid var(--ink);border-radius:26px;overflow:hidden;isolation:isolate}
.m.dark{background:var(--ink);color:var(--bg)}
.m .m-art{position:absolute;right:30px;bottom:30px;width:38%;aspect-ratio:3/4;z-index:0;transition:transform .7s}
.m:hover .m-art{transform:translateY(-8px) rotate(-1.5deg)}
.m>*:not(.m-art){position:relative;z-index:1;max-width:56%}
.m.dark .m-art{box-shadow:0 0 0 1.5px var(--star),0 0 0 6px var(--ink),0 0 0 7px color-mix(in srgb,var(--star) 60%,transparent)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:48px;padding:8px}
.tri .arch{aspect-ratio:3/4}.tri .arch:nth-child(2){margin-top:40px}
.m .role{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;display:flex;gap:10px;align-items:center}
.m .role::before{content:"✦";color:var(--star)}
.m h3{font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:clamp(40px,5vw,64px);line-height:1}
.m .at{opacity:.75;font-size:15px}
.m .btn{justify-self:start}
.m.dark .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.m.dark .btn:hover{background:transparent;color:var(--bg)}

/* looks strip */
.looks-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px;margin-bottom:34px}
.looks-head .sec-head{margin:0}
.nav-arr{display:flex;gap:10px}
.nav-arr button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink);background:none;display:grid;place-items:center;transition:background .3s,color .3s}
.nav-arr button:hover{background:var(--ink);color:var(--bg)}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px;scrollbar-width:thin}
.tile{position:relative;flex:none;width:min(72vw,290px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;scroll-snap-align:start;display:block;text-decoration:none;color:#fff;isolation:isolate}
.tile .bg{position:absolute;inset:0;z-index:-1;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.tile .bg::before{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,rgba(10,10,10,.72));z-index:2}
.tile:hover .bg{transform:scale(1.1) rotate(1deg)}

.t1 .bg{background:linear-gradient(165deg,#3A3A3A,#0A0A0A)}
.t2 .bg{background:linear-gradient(165deg,#C9A3AE,#4B2A36)}
.t3 .bg{background:linear-gradient(165deg,#8E8A84,#1B1A19)}
.t4 .bg{background:linear-gradient(165deg,#E9DFD2,#8C7B66)}
.tile .tg{position:absolute;left:14px;top:14px;background:#fff;color:#0A0A0A;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:6px 11px;border-radius:999px}
.tile .pl{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tile .tic{position:absolute;top:24%;left:50%;width:42%;transform:translateX(-50%);color:rgba(255,255,255,.92)}
.tile .cap{position:absolute;left:18px;right:18px;bottom:18px;font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:28px;line-height:1}
.tile .cap small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:.16em;font-weight:600;opacity:.8;margin-top:6px}
.tile.photo{background:var(--bg2)}
.tile.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;transition:transform .8s}
.tile.photo:hover img{transform:scale(1.07)}
.tile.photo::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:-1}
.tile .rm{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px}
.up{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;border:1.5px dashed var(--ink);border-radius:16px;margin-bottom:20px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}

/* location */
.loc{background:var(--bg2);border-top:1px solid var(--line)}
.loc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
.loc h2{font-size:clamp(40px,7vw,92px);margin:16px 0 24px}
.loc .addr{font-size:19px;margin-bottom:26px}
.loc .btns{display:flex;flex-wrap:wrap;gap:10px}
.hours{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.hours li{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hours li b{font-weight:600}
.hours li.off{color:var(--muted)}
.hours-h{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;margin-bottom:14px}

/* booking */
.bk-card{box-shadow:0 0 0 6px var(--bg),0 0 0 7px color-mix(in srgb,var(--star) 55%,transparent);border:1.5px solid var(--ink);border-radius:28px;background:var(--card);overflow:hidden}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;margin:0;padding:6px 8px 0;border-bottom:1px solid var(--line);position:relative}
.steps li{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 10px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);position:relative;min-width:0;transition:color .3s}
.steps li+li::before{content:"";position:absolute;left:-28%;top:33px;width:34%;height:1.5px;background:var(--line)}
.steps li.done+li::before,.steps li.on::before{background:linear-gradient(90deg,var(--gold3),var(--gold1))}
.steps li b{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--card);transition:all .35s cubic-bezier(.2,.7,.2,1);position:relative;z-index:1}
.steps li b svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.steps li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.on{color:var(--ink)}
.steps li.on b{background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold3));border-color:transparent;color:#0A0A0A;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--gold2) 80%,transparent);transform:scale(1.08)}
.steps li.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold3),var(--gold1),var(--gold3))}
.steps li.done{color:var(--ink)}
.steps li.done b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{padding:36px}
.pane h3{font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:clamp(28px,4vw,44px);margin-bottom:22px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);transition:border-color .2s,background .2s,color .2s}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt .oi{width:30px;height:30px;flex:none}
.opt i{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid currentColor}
.opt i.o{background:#C9A3AE}.opt i.z{background:var(--star)}.opt i.a{background:linear-gradient(90deg,#C9A3AE 50%,var(--star) 50%)}
.opt b{font-weight:600;font-size:15px}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;margin-bottom:18px}
.dates button{flex:none;width:68px;scroll-snap-align:start;display:grid;justify-items:center;padding:10px 0;background:var(--card);border:1.5px solid var(--line);border-radius:16px;line-height:1.25}
.dates button:hover:not(:disabled){border-color:var(--ink)}
.dates small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dates b{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1}
.dates button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dates button[aria-pressed="true"] small{color:inherit;opacity:.75}
.dates button:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.times button{padding:12px 0;background:var(--card);border:1.5px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums;font-weight:600}
.times button:hover:not(:disabled){border-color:var(--ink)}
.times button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.times button:disabled{opacity:.38;text-decoration:line-through;cursor:not-allowed}
.times .none{grid-column:1/-1;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fld{display:grid;gap:6px}.fld.full{grid-column:1/-1}
.fld label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.fld input,.fld textarea{font-size:16px;width:100%}
.fld textarea{min-height:92px;resize:vertical}
.err{color:var(--bad);font-size:14px;min-height:1.3em;margin-top:8px}
.sum{border-top:1.5px solid var(--ink);margin-bottom:8px}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.sum span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted);padding-top:3px}
.sum b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.nav-b{display:flex;justify-content:space-between;gap:12px;padding:0 36px 36px}
.hint{color:var(--muted);font-size:14px;padding:0 36px 24px;max-width:70ch}
.done{padding:48px 36px;display:grid;gap:18px;justify-items:start}
.done svg{width:72px;height:72px}
.done h3{font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:clamp(34px,5vw,60px);line-height:1}
.done p{color:var(--muted);max-width:56ch}
.done pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:500 14px/1.65 var(--f-body);background:var(--bg2);padding:18px;border-radius:14px;width:100%}
.done .acts{display:flex;flex-wrap:wrap;gap:10px}

/* staff */
.staff{background:var(--bg2);border-top:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{background:none;border:1.5px solid var(--line);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sf-list{display:grid;gap:10px}
.bk{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 20px}
.bk .when b{display:block;font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.bk .when small{font-size:12px;color:var(--muted)}
.bk .who{min-width:0;display:grid;gap:2px}.bk .who b{font-weight:600;overflow-wrap:anywhere}.bk .who span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.bk .act{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:5px 11px;border:1.5px solid currentColor;border-radius:999px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pending{color:var(--warn)}.pill.confirmed{color:var(--ok)}.pill.cancelled{color:var(--bad)}
.empty-state{padding:34px;border:1.5px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}

/* footer */
.foot{background:var(--band);color:var(--band-ink);padding-block:70px 40px}
.foot .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:end}
.foot .big{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(54px,11vw,170px);line-height:.9}
.foot p{opacity:.65;margin-top:14px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.foot li a{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.2);text-decoration:none;transition:padding .3s}
.foot li a:hover{padding-left:10px}
.foot li small{opacity:.6;font-size:13px}
.foot .fine{grid-column:1/-1;font-size:12px;letter-spacing:.16em;opacity:.5;text-transform:uppercase;padding-top:30px}

.will{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.will.in{opacity:1;transform:none}

@media (max-width:1000px){

  .steps li b{width:38px;height:38px}.steps li+li::before{top:27px;left:-30%;width:40%}.steps li span{max-width:100%}
}

async function loadBusy(){
  if(!CONFIG.endpoint)return;
  try{
    var to=new Date();to.setDate(to.getDate()+CONFIG.horizon);
    var r=await fetch(CONFIG.endpoint+"?action=busy&from="+TODAY+"&to="+ymd(to));
    var j=await r.json();var m={};(j.busy||[]).forEach(function(k){m[k]=true});TAKEN=m;refreshTimes();
  }catch(e){}
}
async function remoteSave(b){
  var r=await fetch(CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({date:b.date,time:b.time,master:b.master,service:t("svc_"+b.service),serviceKey:b.service,name:b.name,phone:b.phone,note:b.note,lang:lang,hp:""})});
  return await r.json();
}
async function dbSave(b){
  var order=b.master==="any"?["olga","ozlem"]:[b.master];
  for(var i=0;i<order.length;i++){
    var m=order[i],id=slotId(b.date,b.time,m),ref=DB.doc("slots/"+id);
    var lease=await ref.acquire({holder:HOLDER,ttlMs:6000});
    if(!lease.acquired)continue;
    var snap=await ref.get(),d=snap.data();
    if(snap.exists&&d&&d.claimed)continue;
    await ref.set({claimed:true,date:b.date,time:b.time,master:m,ts:new Date().toISOString()});
    try{
      await DB.doc("bookings/"+id).set({date:b.date,time:b.time,master:m,service:b.service,name:b.name,phone:b.phone,note:b.note,status:isStaff?"confirmed":"pending",lang:lang,createdAt:new Date().toISOString(),by:uid||null,source:isStaff?"staff":"web"});
    }catch(err){try{await ref.delete()}catch(_){}throw err}
    return {ok:true,master:m};
  }
  return {ok:false,reason:"taken"};
}
async function confirmBooking(){
  var btn=$("#bNext");btn.disabled=true;
  var b={service:S.service,master:S.master,date:S.date,time:S.time,name:S.name.trim(),phone:S.phone.trim(),note:S.note.trim()},mode="send";
  try{
    if(CONFIG.endpoint){
      var r=await remoteSave(b);
      if(r&&r.ok){mode="saved";if(r.master)b.master=r.master}
      else if(r&&r.reason==="taken"){step=3;await loadBusy();renderWizard();$("#bkErr").textContent=t("d_taken");btn.disabled=false;return}
    }else if(DB&&canWrite!==false){
      var r2=await dbSave(b);
      if(r2.ok){mode="saved";b.master=r2.master}
      else{step=3;renderWizard();$("#bkErr").textContent=t("d_taken");btn.disabled=false;return}
    }
  }catch(err){if(err&&err.code==="invalid_argument")canWrite=false}
  btn.disabled=false;LAST={b:b,mode:mode};
  $("#bkWiz").hidden=true;$("#bookDone").hidden=false;renderDone();
  $("#bkCard").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- theme / language buttons ---------- */
$("#themeBtn").addEventListener("click",function(){
  var root=document.documentElement,cur=root.getAttribute("data-theme");
  if(!cur)cur="light";
  var next=cur==="dark"?"light":"dark";root.setAttribute("data-theme",next);store.set("tb-theme",next);
});
var stt=store.get("tb-theme");if(stt==="dark"||stt==="light")document.documentElement.setAttribute("data-theme",stt);
$$("[data-lang]").forEach(function(b){b.addEventListener("click",function(){applyLang(b.getAttribute("data-lang"))})});

/* ---------- motion ---------- */
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function counters(){
  $$("[data-count]").forEach(function(el){
    var to=+el.getAttribute("data-count");
    function run(){
      if(reduce){el.textContent=to.toLocaleString("tr-TR");return}
      var t0=performance.now();(function step(n){var p=Math.min(1,(n-t0)/1600);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString("tr-TR");if(p<1)requestAnimationFrame(step)})(t0);
    }
    if(!("IntersectionObserver" in window)){el.textContent=to.toLocaleString("tr-TR");return}
    var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){io.disconnect();run()}});io.observe(el);
  });
}
function reveal(){
  var els=$$(".will");
  if(!("IntersectionObserver" in window)||reduce){els.forEach(function(e){e.classList.add("in")});return}
  var vh=innerHeight;els.forEach(function(e){if(e.getBoundingClientRect().top<vh)e.classList.add("in")});
  var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}})},{threshold:.08});
  els.forEach(function(e){if(!e.classList.contains("in"))io.observe(e)});
  setTimeout(function(){els.forEach(function(e){e.classList.add("in")})},4000);
}
function scrollFx(){
  var prog=$("#prog"),c1=$(".c1"),c3=$(".c3"),links=$$(".links a"),secs=["top","hizmetler","studyo","ustalar","gorunumler","randevu"].map(function(id){return document.getElementById(id)});
  var tick=false;
  function upd(){
    tick=false;
    var h=document.documentElement,max=h.scrollHeight-innerHeight,y=scrollY;
    prog.style.transform="scaleX("+(max>0?Math.min(1,y/max):0)+")";
    if(!reduce&&y<1400){c1.style.translate="0 "+(y*.12)+"px";c3.style.translate="0 "+(y*-.08)+"px"}
    var cur=0;secs.forEach(function(s,i){if(s&&s.getBoundingClientRect().top<innerHeight*.4)cur=i});
    links.forEach(function(a,i){a.classList.toggle("on",i===cur)});
  }
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});upd();
}

/* ---------- init ---------- */

var sl=store.get("tb-lang"),nv=(navigator.language||"tr").slice(0,2).toLowerCase();
mountArt();
applyLang(sl&&T[sl]?sl:(T[nv]?nv:"tr"));
counters();reveal();scrollFx();boot();
})();
</script>
